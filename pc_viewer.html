<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>动态水下点云对比（可交互）</title>
<style>
body{font-family:system-ui,sans-serif;background:#101014;color:#ddd;margin:18px}
h1{font-size:17px;margin:0 0 4px} .sub{color:#888;font-size:12px;margin-bottom:12px}
.bar{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;
  background:#181820;border:1px solid #2c2c36;border-radius:10px;padding:10px 14px}
select{background:#1c1c22;color:#ddd;border:1px solid #444;border-radius:6px;
  padding:5px 10px;font-size:14px}
label{font-size:13px;color:#9ab;display:flex;align-items:center;gap:6px}
input[type=range]{width:120px}
button{background:#27407a;color:#fff;border:0;border-radius:6px;padding:5px 12px;
  cursor:pointer;font-size:13px}
#tags{color:#789;font-size:12px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:#191920;border:1px solid #2c2c36;border-radius:10px;overflow:hidden;
  position:relative}
.card h3{margin:0;padding:8px 12px;font-size:14px}
.card canvas{width:100%;aspect-ratio:1;display:block;background:#0a0a0e;cursor:grab}
.card canvas:active{cursor:grabbing}
.card video{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#000}
.load{position:absolute;top:38px;left:12px;color:#fc6;font-size:12px;
  background:#000a;padding:2px 8px;border-radius:4px}
</style></head><body>
<h1>动态水下场景 · 四模型点云对比（可交互）</h1>
<div class="sub">点云为各模型预测深度+位姿反投影（无 GT）· 圆点渲染 · 拖动=旋转 滚轮=缩放</div>
<div class="bar">
  场景 <select id="sel"></select>
  <label>自动旋转 <input type="range" id="spd" min="0" max="100" value="15"><span id="spdv">15</span></label>
  <label>点大小 <input type="range" id="psz" min="1" max="20" value="6"><span id="pszv">6</span></label>
  <label><input type="checkbox" id="sync" checked>四家视角同步</label>
  <button id="reset">重置视角</button>
  <span id="tags"></span>
</div>
<div class="grid">
  <div class="card"><h3>原始视频</h3><video id="v" controls muted loop autoplay playsinline></video></div>

  <div class="card" id="card_wat3r">
    <h3 style="color:#6fb3ff">Wat3R</h3>
    <canvas id="cv_wat3r"></canvas>
    <div class="load" id="ld_wat3r">初始化…</div>
  </div>
  <div class="card" id="card_da3">
    <h3 style="color:#ffb066">DA3</h3>
    <canvas id="cv_da3"></canvas>
    <div class="load" id="ld_da3">初始化…</div>
  </div>
  <div class="card" id="card_watervggt">
    <h3 style="color:#7ddf7d">Water-VGGT</h3>
    <canvas id="cv_watervggt"></canvas>
    <div class="load" id="ld_watervggt">初始化…</div>
  </div>
  <div class="card" id="card_watervggt_wcv">
    <h3 style="color:#c49bff">Water-VGGT+WCV</h3>
    <canvas id="cv_watervggt_wcv"></canvas>
    <div class="load" id="ld_watervggt_wcv">初始化…</div>
  </div>
</div>
<script src="assets/three.min.js"></script>
<script src="assets/js/controls/OrbitControls.js"></script>
<script>
var SCENES = [{"id": "creature_01", "video": "raw/creature-01__ref.mp4", "tags": "浑浊:low 偏绿:low 纹理:high 相机动:medium 鱼动:high", "bins": {"wat3r": "clouds/creature_01_wat3r.bin", "da3": "clouds/creature_01_da3.bin", "watervggt": "clouds/creature_01_watervggt.bin", "watervggt_wcv": "clouds/creature_01_watervggt_wcv.bin"}}, {"id": "creature_07", "video": "raw/creature-07__ref.mp4", "tags": "浑浊:low 偏绿:medium 纹理:high 相机动:medium 鱼动:high", "bins": {"wat3r": "clouds/creature_07_wat3r.bin", "da3": "clouds/creature_07_da3.bin", "watervggt": "clouds/creature_07_watervggt.bin", "watervggt_wcv": "clouds/creature_07_watervggt_wcv.bin"}}, {"id": "creature_08", "video": "raw/creature-08__ref.mp4", "tags": "浑浊:low 偏绿:medium 纹理:high 相机动:medium 鱼动:medium", "bins": {"wat3r": "clouds/creature_08_wat3r.bin", "da3": "clouds/creature_08_da3.bin", "watervggt": "clouds/creature_08_watervggt.bin", "watervggt_wcv": "clouds/creature_08_watervggt_wcv.bin"}}, {"id": "creature_13", "video": "raw/creature-13__ref.mp4", "tags": "浑浊:low 偏绿:low 纹理:medium 相机动:low 鱼动:medium", "bins": {"wat3r": "clouds/creature_13_wat3r.bin", "da3": "clouds/creature_13_da3.bin", "watervggt": "clouds/creature_13_watervggt.bin", "watervggt_wcv": "clouds/creature_13_watervggt_wcv.bin"}}, {"id": "creature_14", "video": "raw/creature-14__ref.mp4", "tags": "浑浊:medium 偏绿:low 纹理:low 相机动:low 鱼动:low", "bins": {"wat3r": "clouds/creature_14_wat3r.bin", "da3": "clouds/creature_14_da3.bin", "watervggt": "clouds/creature_14_watervggt.bin", "watervggt_wcv": "clouds/creature_14_watervggt_wcv.bin"}}, {"id": "creature_11", "video": "raw/creature-11__ref.mp4", "tags": "浑浊:medium 偏绿:medium 纹理:high 相机动:medium 鱼动:high", "bins": {"wat3r": "clouds/creature_11_wat3r.bin", "da3": "clouds/creature_11_da3.bin", "watervggt": "clouds/creature_11_watervggt.bin", "watervggt_wcv": "clouds/creature_11_watervggt_wcv.bin"}}, {"id": "creature_20", "video": "raw/creature-20__ref.mp4", "tags": "浑浊:medium 偏绿:medium 纹理:high 相机动:medium 鱼动:high", "bins": {"wat3r": "clouds/creature_20_wat3r.bin", "da3": "clouds/creature_20_da3.bin", "watervggt": "clouds/creature_20_watervggt.bin", "watervggt_wcv": "clouds/creature_20_watervggt_wcv.bin"}}, {"id": "creature_15", "video": "raw/creature-15__ref.mp4", "tags": "浑浊:high 偏绿:low 纹理:low 相机动:low 鱼动:low", "bins": {"wat3r": "clouds/creature_15_wat3r.bin", "da3": "clouds/creature_15_da3.bin", "watervggt": "clouds/creature_15_watervggt.bin", "watervggt_wcv": "clouds/creature_15_watervggt_wcv.bin"}}, {"id": "creature_16", "video": "raw/creature-16__ref.mp4", "tags": "浑浊:high 偏绿:low 纹理:low 相机动:low 鱼动:low", "bins": {"wat3r": "clouds/creature_16_wat3r.bin", "da3": "clouds/creature_16_da3.bin", "watervggt": "clouds/creature_16_watervggt.bin", "watervggt_wcv": "clouds/creature_16_watervggt_wcv.bin"}}, {"id": "arch_08", "video": "raw/arch-08__ref.mp4", "tags": "浑浊:high 偏绿:high 纹理:medium 相机动:medium 鱼动:low", "bins": {"wat3r": "clouds/arch_08_wat3r.bin", "da3": "clouds/arch_08_da3.bin", "watervggt": "clouds/arch_08_watervggt.bin", "watervggt_wcv": "clouds/arch_08_watervggt_wcv.bin"}}, {"id": "creature_03", "video": "raw/creature-03__ref.mp4", "tags": "浑浊:medium 偏绿:high 纹理:medium 相机动:high 鱼动:medium", "bins": {"wat3r": "clouds/creature_03_wat3r.bin", "da3": "clouds/creature_03_da3.bin", "watervggt": "clouds/creature_03_watervggt.bin", "watervggt_wcv": "clouds/creature_03_watervggt_wcv.bin"}}, {"id": "arch_10", "video": "raw/arch-10__ref.mp4", "tags": "浑浊:medium 偏绿:high 纹理:medium 相机动:high 鱼动:medium", "bins": {"wat3r": "clouds/arch_10_wat3r.bin", "da3": "clouds/arch_10_da3.bin", "watervggt": "clouds/arch_10_watervggt.bin", "watervggt_wcv": "clouds/arch_10_watervggt_wcv.bin"}}];
var MODELS = ["wat3r", "da3", "watervggt", "watervggt_wcv"];

function fail(msg) {
  for (var i = 0; i < MODELS.length; i++)
    document.getElementById('ld_' + MODELS[i]).textContent = msg;
}
// 任何脚本错误都直接显示到面板上，不再静默死
window.onerror = function(msg, src, line) {
  fail('脚本错误: ' + msg + ' @' + line);
  return false;
};
if (typeof THREE === 'undefined') {
  fail('three.js 没加载上');
} else if (typeof THREE.OrbitControls === 'undefined') {
  fail('OrbitControls 没加载上');
} else if (!(function() {
  var c = document.createElement('canvas');
  return !!(c.getContext('webgl2') || c.getContext('webgl'));
})()) {
  fail('浏览器拿不到 WebGL 上下文（试试 Chrome/Edge 新版本，或换台机器开）');
} else {
try {
// 注：与导出坐标一致用 Z 朝上。three 0.147 里全局默认叫 DefaultUp（新版才改名
// DEFAULT_UP），不依赖它 —— 每个相机创建时单独设 up。

function circleTexture() {
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var g = c.getContext('2d');
  g.beginPath(); g.arc(32, 32, 30, 0, Math.PI * 2);
  g.fillStyle = '#fff'; g.fill();
  var t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}
var dotTex = circleTexture();

var panels = {};
for (var mi = 0; mi < MODELS.length; mi++) {
  var m = MODELS[mi];
  var canvas = document.getElementById('cv_' + m);
  var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0e);
  var cam = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
  cam.up.set(0, 0, 1);
  var ctrl = new THREE.OrbitControls(cam, canvas);
  ctrl.enablePan = false; ctrl.enableDamping = false;
  ctrl.minDistance = 0.6; ctrl.maxDistance = 15;
  var mat = new THREE.PointsMaterial({size: 0.006, map: dotTex, alphaTest: 0.5,
    vertexColors: true, sizeAttenuation: true});
  panels[m] = {renderer: renderer, scene: scene, cam: cam, ctrl: ctrl,
                mat: mat, points: null, dragging: false};
  (function(mm) {
    panels[mm].ctrl.addEventListener('start', function() { panels[mm].dragging = true; });
    panels[mm].ctrl.addEventListener('end', function() { panels[mm].dragging = false; });
    panels[mm].ctrl.addEventListener('change', function() { syncFrom(mm); });
  })(m);
}

function resetView() {
  var az = -Math.PI / 6, el = Math.PI / 7, d = 2.6;
  for (var i = 0; i < MODELS.length; i++) {
    var p = panels[MODELS[i]];
    p.cam.position.set(d * Math.cos(el) * Math.cos(az),
                       d * Math.cos(el) * Math.sin(az), d * Math.sin(el));
    p.cam.up.set(0, 0, 1);
    p.cam.lookAt(0, 0, 0);
  }
}
function syncFrom(src) {
  if (!document.getElementById('sync').checked) return;
  var s = panels[src];
  for (var i = 0; i < MODELS.length; i++) {
    var m = MODELS[i];
    if (m === src) continue;
    var p = panels[m];
    p.cam.position.copy(s.cam.position);
    p.cam.up.copy(s.cam.up);
    p.cam.lookAt(0, 0, 0);
  }
}

var currentToken = 0;
function loadScene(i) {
  var s = SCENES[i];
  document.getElementById('v').src = s.video;
  document.getElementById('tags').textContent = s.tags;
  var token = ++currentToken;
  for (var k = 0; k < MODELS.length; k++) {
    (function(m) {
      var p = panels[m];
      var ld = document.getElementById('ld_' + m);
      if (!s.bins[m]) { ld.style.display = 'block'; ld.textContent = '无数据'; return; }
      ld.style.display = 'block'; ld.textContent = '加载中…';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', s.bins[m], true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function() {
        if (token !== currentToken) return;   // 场景已切走，丢弃
        if (xhr.status !== 200) { ld.textContent = '加载失败: HTTP ' + xhr.status; return; }
        var buf = xhr.response;
        var n = Math.floor(buf.byteLength / 15);
        var f32 = new Float32Array(buf, 0, n * 3);
        var u8 = new Uint8Array(buf, n * 12, n * 3);
        var col = new Float32Array(n * 3);
        for (var j = 0; j < n * 3; j++) col[j] = u8[j] / 255;
        var geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(f32, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        if (p.points) { p.scene.remove(p.points); p.points.geometry.dispose(); }
        p.points = new THREE.Points(geo, p.mat);
        p.scene.add(p.points);
        ld.style.display = 'none';
      };
      xhr.onerror = function() {
        if (token !== currentToken) return;
        ld.textContent = '加载失败: 网络错误';
      };
      xhr.send();
    })(MODELS[k]);
  }
  resetView();
}

var sel = document.getElementById('sel');
for (var i = 0; i < SCENES.length; i++) {
  var o = document.createElement('option');
  o.value = i; o.textContent = SCENES[i].id; sel.appendChild(o);
}
sel.onchange = function(e) { loadScene(+e.target.value); };
var spd = document.getElementById('spd');
spd.oninput = function() { document.getElementById('spdv').textContent = spd.value; };
var psz = document.getElementById('psz');
psz.oninput = function() {
  document.getElementById('pszv').textContent = psz.value;
  for (var i = 0; i < MODELS.length; i++)
    panels[MODELS[i]].mat.size = psz.value / 1000;
};
document.getElementById('reset').onclick = resetView;

var last = performance.now();
var axis = new THREE.Vector3(0, 0, 1);
function tick(now) {
  var dt = Math.min((now - last) / 1000, 0.05); last = now;
  var ang = spd.value / 100 * 0.8 * dt;   // 最大 ~0.8 rad/s，默认 15 ≈ 52s/圈
  for (var i = 0; i < MODELS.length; i++) {
    var p = panels[MODELS[i]];
    if (ang > 0 && !p.dragging) {
      p.cam.position.applyAxisAngle(axis, ang);
      p.cam.lookAt(0, 0, 0);
      syncFrom(MODELS[i]);
    }
    p.renderer.render(p.scene, p.cam);
  }
  requestAnimationFrame(tick);
}

function resize() {
  for (var i = 0; i < MODELS.length; i++) {
    var p = panels[MODELS[i]];
    var r = p.renderer.domElement.getBoundingClientRect();
    if (r.width > 0) p.renderer.setSize(r.width, r.width, false);
    p.cam.aspect = 1;
    p.cam.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);

resize();
resetView();
requestAnimationFrame(tick);
loadScene(0);
} catch (e) {
  fail('初始化异常: ' + (e && e.message ? e.message : e));
}
}
</script>
</body></html>
