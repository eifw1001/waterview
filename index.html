<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>水下点云逐帧对比（分组）</title>
<style>
body{font-family:system-ui,sans-serif;background:#101014;color:#ddd;margin:18px}
h1{font-size:17px;margin:0 0 4px} .sub{color:#888;font-size:12px;margin-bottom:12px}
.bar{display:flex;gap:16px;align-items:center;margin-bottom:8px;flex-wrap:wrap;
  background:#181820;border:1px solid #2c2c36;border-radius:10px;padding:10px 14px}
select{background:#1c1c22;color:#ddd;border:1px solid #444;border-radius:6px;
  padding:5px 10px;font-size:14px;max-width:330px}
label{font-size:13px;color:#9ab;display:flex;align-items:center;gap:6px}
input[type=range]{width:110px}
button{background:#27407a;color:#fff;border:0;border-radius:6px;padding:5px 12px;
  cursor:pointer;font-size:13px}
input[type=range]#frame{flex:1;min-width:200px}
#frv{font-variant-numeric:tabular-nums;color:#cde;min-width:52px}
#tags{color:#789;font-size:12px;margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.pgrid .card canvas{aspect-ratio:1}
.bgrid img#fimg,.bgrid video{width:100%;height:270px;object-fit:contain;display:block;background:#000}
.bgrid .card canvas{display:none}
@media (max-width:1400px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
.card{background:#191920;border:1px solid #2c2c36;border-radius:10px;overflow:hidden;
  position:relative}
.card h3{margin:0;padding:8px 12px;font-size:14px}
.card canvas{width:100%;aspect-ratio:1;display:block;background:#0a0a0e;cursor:grab}
.card canvas:active{cursor:grabbing}
.card video{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#000}
.card img#fimg{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#000}
.load{position:absolute;top:38px;left:12px;color:#fc6;font-size:12px;
  background:#000a;padding:2px 8px;border-radius:4px}
</style></head><body>
<h1>水下场景点云逐帧对比 · 三数据源分组</h1>
<div class="sub">每帧独立反投影点云（Umeyama 对齐到 Wat3R）· 进度条逐帧 ·
「输入帧」卡片显示当前帧对应的静止输入图 · 置信度滑杆只显示前 X% 的点</div>
<div class="bar">
  场景 <select id="sel"></select>
  <button id="play">▶ 播放</button>
  <input type="range" id="frame" min="0" max="31" value="0"><span id="frv">0/31</span>
  <label>帧率 <input type="range" id="fps" min="1" max="10" value="3"><span id="fpsv">3f/s</span></label>
  <label><input type="checkbox" id="rot">自动旋转</label>
  <label>点大小 <input type="range" id="psz" min="1" max="20" value="8"><span id="pszv">8</span></label>
  <label>置信度 <input type="range" id="conf" min="5" max="100" value="100"><span id="confv">100%</span></label>
  <label><input type="checkbox" id="sync" checked>四家视角同步</label>
  <button id="reset">重置视角</button>
  <span id="tags"></span>
</div>
<div class="pgrid">

  <div class="card" id="card_wat3r">
    <h3 style="color:#6fb3ff">Wat3R</h3>
    <canvas id="cv_wat3r"></canvas>
    <div class="load" id="ld_wat3r">初始化…</div>
  </div>
  <div class="card" id="card_da3">
    <h3 style="color:#ffb066">DA3</h3>
    <canvas id="cv_da3"></canvas>
    <div class="load" id="ld_da3">初始化…</div>
  </div>
  <div class="card" id="card_watervggt">
    <h3 style="color:#7ddf7d">Water-VGGT</h3>
    <canvas id="cv_watervggt"></canvas>
    <div class="load" id="ld_watervggt">初始化…</div>
  </div>
  <div class="card" id="card_watervggt_wcv">
    <h3 style="color:#c49bff">Water-VGGT+WCV</h3>
    <canvas id="cv_watervggt_wcv"></canvas>
    <div class="load" id="ld_watervggt_wcv">初始化…</div>
  </div>
</div>
<div class="bgrid">
  <div class="card"><h3>输入帧（当前帧）</h3><img id="fimg" alt="输入帧"></div>
  <div class="card" id="vcard"><h3>原始视频（UVEB）</h3><video id="v" controls muted loop playsinline></video></div>
</div>

    var p = panels[MODELS[i]];
    p.cam.position.set(d * Math.cos(el) * Math.cos(az),
                       d * Math.cos(el) * Math.sin(az), d * Math.sin(el));
    p.cam.up.set(0, 0, 1);
    p.cam.lookAt(0, 0, 0);
  }
}
function syncFrom(src) {
  if (!document.getElementById('sync').checked) return;
  var s = panels[src];
  for (var i = 0; i < MODELS.length; i++) {
    var m = MODELS[i];
    if (m === src) continue;
    var p = panels[m];
    p.cam.position.copy(s.cam.position);
    p.cam.up.copy(s.cam.up);
    p.cam.lookAt(0, 0, 0);
  }
}

var curScene = 0, curFrame = 0, curConf = 100, playing = false;

function applyFrame(mm) {
  var p = panels[mm];
  if (!p.buf || !p.meta) return;
  var n = p.meta.counts[curFrame] || 0;
  var off = p.meta.offsets[curFrame] || 0;
  var thr = Math.round(curConf * 255 / 100) - 0.5;
  var xyz = new Float32Array(p.buf, off, n * 3);
  var rgb = new Uint8Array(p.buf, off + n * 12, n * 3);
  var cf  = new Uint8Array(p.buf, off + n * 15, n);
  var pa = p.geo.attributes.position.array;
  var ca = p.geo.attributes.color.array;
  var k = 0;
  for (var i = 0; i < n; i++) {
    if (cf[i] < thr) continue;
    pa[k * 3] = xyz[i * 3]; pa[k * 3 + 1] = xyz[i * 3 + 1]; pa[k * 3 + 2] = xyz[i * 3 + 2];
    ca[k * 3] = rgb[i * 3]; ca[k * 3 + 1] = rgb[i * 3 + 1]; ca[k * 3 + 2] = rgb[i * 3 + 2];
    k++;
    if (k >= MAXN) break;
  }
  p.geo.attributes.position.needsUpdate = true;
  p.geo.attributes.color.needsUpdate = true;
  p.geo.setDrawRange(0, k);
  p.geo.computeBoundingSphere();
  p.shown = k;
  var ld = document.getElementById('ld_' + mm);
  if (k === 0) { ld.style.display = 'block'; ld.textContent = '该帧 0 点'; }
  else ld.style.display = 'none';
}

function pad3(i) { return ('00' + i).slice(-3); }

function applyFrameAll() {
  for (var i = 0; i < MODELS.length; i++) applyFrame(MODELS[i]);
  var fr = document.getElementById('frame');
  fr.max = (panels[MODELS[0]].meta ? panels[MODELS[0]].meta.counts.length - 1 : 31);
  if (curFrame > +fr.max) curFrame = +fr.max;
  fr.value = curFrame;
  document.getElementById('frv').textContent = curFrame + '/' + fr.max;
  // 静帧跟随
  var s = SCENES[curScene];
  document.getElementById('fimg').src = s.img + pad3(curFrame) + '.jpg';
  // 视频跟随（仅 UVEB）
  var v = document.getElementById('v');
  if (v.duration && isFinite(v.duration)) {
    try { v.currentTime = curFrame / Math.max(+fr.max, 1) * (v.duration - 0.05); } catch (e) {}
  }
}

var currentToken = 0;
function loadScene(i) {
  var s = SCENES[i];
  curScene = i; curFrame = 0;
  document.getElementById('tags').textContent = s.tags;
  var fr = document.getElementById('frame'); fr.value = 0;
  var vcard = document.getElementById('vcard');
  var v = document.getElementById('v');
  if (s.video) {
    vcard.style.display = '';
    v.style.display = '';
    v.src = s.video;
  } else {
    vcard.style.display = 'none';
    v.removeAttribute('src'); v.load();
  }
  document.getElementById('fimg').src = s.img + '000.jpg';
  // 预载静帧
  for (var k = 0; k < s.nf; k++) {
    var im = new Image(); im.src = s.img + pad3(k) + '.jpg';
  }
  var token = ++currentToken;
  for (var k = 0; k < MODELS.length; k++) {
    (function(m) {
      var p = panels[m];
      var ld = document.getElementById('ld_' + m);
      p.buf = null; p.meta = null;
      p.geo.setDrawRange(0, 0);
      if (!s.bins[m]) { ld.style.display = 'block'; ld.textContent = '无数据'; return; }
      ld.style.display = 'block'; ld.textContent = '加载中…';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', s.bins[m].url, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function() {
        if (token !== currentToken) return;
        if (xhr.status !== 200) { ld.textContent = '加载失败: HTTP ' + xhr.status; return; }
        p.buf = xhr.response;
        p.meta = {counts: s.bins[m].counts, offsets: s.bins[m].offsets};
        ld.style.display = 'none';
        applyFrameAll();
      };
      xhr.onerror = function() {
        if (token !== currentToken) return;
        ld.textContent = '加载失败: 网络错误';
      };
      xhr.send();
    })(MODELS[k]);
  }
  resetView();
}

var sel = document.getElementById('sel');
var lastGroup = null;
for (var i = 0; i < SCENES.length; i++) {
  var g = SCENES[i].group;
  if (g !== lastGroup) {
    var og = document.createElement('optgroup');
    og.label = GROUP_LABEL[g] || g;
    og.id = 'og_' + g;
    sel.appendChild(og);
    lastGroup = g;
  }
  var o = document.createElement('option');
  o.value = i; o.textContent = SCENES[i].id;
  sel.lastChild.appendChild(o);
}
sel.onchange = function(e) { loadScene(+e.target.value); };
var fr = document.getElementById('frame');
fr.oninput = function() { curFrame = +fr.value; applyFrameAll(); };
var fps = document.getElementById('fps');
fps.oninput = function() { document.getElementById('fpsv').textContent = fps.value + 'f/s'; };
var psz = document.getElementById('psz');
psz.oninput = function() {
  document.getElementById('pszv').textContent = psz.value;
  for (var i = 0; i < MODELS.length; i++)
    panels[MODELS[i]].mat.size = psz.value / 700;
};
var confS = document.getElementById('conf');
confS.oninput = function() {
  curConf = +confS.value;
  document.getElementById('confv').textContent = curConf + '%';
  applyFrameAll();
};
document.getElementById('reset').onclick = resetView;
var playBtn = document.getElementById('play');
playBtn.onclick = function() {
  playing = !playing;
  playBtn.textContent = playing ? '❚❚ 暂停' : '▶ 播放';
};

var last = performance.now(), lastF = performance.now();
var axis = new THREE.Vector3(0, 0, 1);
function tick(now) {
  var dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing && (now - lastF) > 1000 / (+fps.value)) {
    lastF = now;
    var mx = +document.getElementById('frame').max;
    curFrame = (curFrame + 1) % (mx + 1);
    applyFrameAll();
  }
  var ang = document.getElementById('rot').checked ? 0.15 * dt : 0;
  for (var i = 0; i < MODELS.length; i++) {
    var p = panels[i === 0 ? MODELS[0] : MODELS[i]];
    if (ang > 0 && !p.dragging) {
      p.cam.position.applyAxisAngle(axis, ang);
      p.cam.lookAt(0, 0, 0);
      syncFrom(MODELS[i]);
    }
    p.renderer.render(p.scene, p.cam);
  }
  requestAnimationFrame(tick);
}

function resize() {
  for (var i = 0; i < MODELS.length; i++) {
    var p = panels[MODELS[i]];
    var r = p.renderer.domElement.getBoundingClientRect();
    if (r.width > 0) p.renderer.setSize(r.width, r.width, false);
    p.cam.aspect = 1;
    p.cam.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);

resize();
resetView();
requestAnimationFrame(tick);
loadScene(0);
} catch (e) {
  fail('初始化异常: ' + (e && e.message ? e.message : e));
}
}
</script>
</body></html>
